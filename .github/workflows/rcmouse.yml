name: Build RC Mouse app

on:
  push:
    branches: [t8l-mouse-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build RC Mouse.app
        working-directory: RCMouse
        run: |
          set -o pipefail
          ./build.sh ci 2>&1 | tee ../build.log

      - name: Package
        run: |
          cd RCMouse/build
          ditto -c -k --sequesterRsrc --keepParent "RC Mouse.app" ../../RCMouse-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RCMouse-mac
          path: RCMouse-mac.zip

      - name: Publish download (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete t8lmouse-latest --yes --cleanup-tag || true
          gh release delete rcmouse-latest --yes --cleanup-tag || true
          gh release create rcmouse-latest RCMouse-mac.zip \
            --target "$GITHUB_SHA" \
            --title "RC Mouse для Mac (M1/M2/M3)" \
            --notes "Скачайте RCMouse-mac.zip, распакуйте и перетащите RC Mouse в «Программы». Первый запуск: правый клик → Открыть."

      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan t8l-mouse-buildlog
          git rm -rf --cached . >/dev/null
          git add -f build.log
          git commit -m "build log $GITHUB_SHA"
          git push -f origin t8l-mouse-buildlog
